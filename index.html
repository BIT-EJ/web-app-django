<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leitor de Patrimônio</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root {
    --primary-inv: #cfbcff;   /* inversePrimary (deepPurple) */
    --surface: #fef7ff;
    --on-surface: #1d1b20;
    --label: #49454f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; font-family: Roboto, system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    background: var(--primary-inv); color: var(--on-surface);
    height: 56px; padding: 0 4px 0 16px; padding-top: env(safe-area-inset-top, 0px);
    box-sizing: content-box; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  header h1 { font-size: 22px; font-weight: 400; margin: 0; }
  .icon-btn { background: none; border: 0; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; color: var(--on-surface); display: grid; place-items: center; }
  .icon-btn:active { background: rgba(0,0,0,.12); }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

  #camera { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
  #zoom {
    position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.54); color: #fff;
    padding: 4px 10px; border-radius: 12px; font-size: 14px; pointer-events: none;
  }
  #erro { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 24px; }

  #painel {
    background: var(--surface); width: 100%; flex-shrink: 0;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center;
  }
  #painel .txt { flex: 1; min-width: 0; }
  #label { font-size: 12px; font-weight: 500; letter-spacing: .5px; color: var(--on-surface); }
  #valor { font-size: 22px; margin-top: 4px; color: var(--on-surface); user-select: text; -webkit-user-select: text; word-break: break-all; }
  #painel .icon-btn { color: var(--label); }

  #snack {
    position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    background: #322f35; color: #f5eff7; padding: 14px 16px; border-radius: 4px; font-size: 14px;
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none;
  }
  #snack.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Leitor de Patrimônio</h1>
    <button class="icon-btn" id="btnFlash" aria-label="Lanterna">
      <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
    </button>
  </header>

  <div id="camera">
    <video id="video" playsinline muted autoplay></video>
    <div id="zoom">Zoom 0%</div>
    <div id="erro"></div>
  </div>

  <div id="painel">
    <div class="txt">
      <div id="label">Aponte para um código de barras</div>
      <div id="valor">—</div>
    </div>
    <button class="icon-btn" id="btnCopiar" title="Copiar" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
    </button>
    <button class="icon-btn" id="btnLimpar" title="Limpar" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
</div>
<div id="snack">Copiado!</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), cam = $('camera');

  // ---------- Estado ----------
  let zoom = 0.0, baseZoom = 0.0;          // 0.0 a 1.0, igual ao app Flutter
  let resultado = null, formato = null;
  let track = null, caps = {};
  let hwZoom = false, torchOn = false;
  const DIGITAL_MAX = 4;                   // zoom digital máximo (quando a câmera não tem zoom por hardware)

  // ---------- Formato: nome igual ao Flutter (ean13, code128, qrCode...) ----------
  const fmtName = n => String(n).toLowerCase().split('_')
    .map((p, i) => i === 0 ? p : p.charAt(0).toUpperCase() + p.slice(1)).join('');

  // ---------- Leitores (todos os formatos) ----------
  const Z = window.ZXing;
  const hints = new Map();
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const zxing = new Z.MultiFormatReader();
  zxing.setHints(hints);

  let nativeDetector = null;
  async function initNative() {
    if (!('BarcodeDetector' in window)) return;
    try {
      const fmts = await BarcodeDetector.getSupportedFormats();
      nativeDetector = new BarcodeDetector({ formats: fmts }); // sem filtro = lê todos
    } catch (e) { nativeDetector = null; }
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function frameToCanvas() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return false;
    // zoom digital: recorta o centro
    const f = hwZoom ? 1 : 1 + zoom * (DIGITAL_MAX - 1);
    const sw = vw / f, sh = vh / f;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    const scale = Math.min(1, 1280 / sw);
    canvas.width = Math.round(sw * scale);
    canvas.height = Math.round(sh * scale);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return true;
  }

  async function lerFrame() {
    if (!frameToCanvas()) return null;
    if (nativeDetector) {
      try {
        const r = await nativeDetector.detect(canvas);
        for (const b of r) if (b.rawValue) return { valor: b.rawValue, formato: fmtName(b.format) };
        return null;
      } catch (e) { nativeDetector = null; /* cai para o ZXing */ }
    }
    try {
      const lum = new Z.HTMLCanvasElementLuminanceSource(canvas);
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(lum));
      const res = zxing.decode(bmp);
      const t = res.getText();
      if (t) return { valor: t, formato: fmtName(Z.BarcodeFormat[res.getBarcodeFormat()]) };
    } catch (e) { /* NotFound: nada neste frame */ }
    return null;
  }

  // ---------- Detecção (equivale ao onDetect) ----------
  function onDetect(valor, fmt) {
    if (valor && valor !== resultado) {
      if (navigator.vibrate) navigator.vibrate(200);   // vibra ao ler um código novo
      resultado = valor; formato = fmt;
      render();
    }
  }

  let busy = false, last = 0;
  async function loop(ts) {
    requestAnimationFrame(loop);
    if (busy || ts - last < 150) return;                // DetectionSpeed.normal
    busy = true; last = ts;
    try {
      const r = await lerFrame();
      if (r) onDetect(r.valor, r.formato);
    } finally { busy = false; }
  }

  // ---------- Zoom ----------
  function setZoom(novo) {
    const z = Math.min(1, Math.max(0, novo));
    if (z === zoom) return;
    zoom = z;
    if (hwZoom && track) {
      const { min, max } = caps.zoom;
      track.applyConstraints({ advanced: [{ zoom: min + z * (max - min) }] }).catch(() => {});
    } else {
      video.style.transform = `scale(${1 + z * (DIGITAL_MAX - 1)})`;
    }
    $('zoom').textContent = `Zoom ${Math.round(zoom * 100)}%`;
  }

  // gesto de pinça (onScaleStart / onScaleUpdate)
  const ptrs = new Map();
  let startDist = 0;
  const dist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  cam.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cam.setPointerCapture(e.pointerId);
    if (ptrs.size === 2) { startDist = dist(); baseZoom = zoom; }
  });
  cam.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && startDist > 0) {
      const scale = dist() / startDist;
      setZoom(baseZoom + (scale - 1) * 0.35);
    }
  });
  const up = e => { ptrs.delete(e.pointerId); startDist = 0; };
  cam.addEventListener('pointerup', up);
  cam.addEventListener('pointercancel', up);
  // scroll do mouse (desktop)
  cam.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom - Math.sign(e.deltaY) * 0.05); }, { passive: false });

  // ---------- Lanterna ----------
  $('btnFlash').onclick = async () => {
    if (!track || !caps.torch) return snack('Lanterna não disponível neste aparelho');
    torchOn = !torchOn;
    try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); }
    catch (e) { torchOn = !torchOn; snack('Não foi possível acionar a lanterna'); }
  };

  // ---------- Painel de resultado ----------
  function render() {
    $('label').textContent = resultado == null ? 'Aponte para um código de barras' : `Código lido (${formato || ''})`;
    $('valor').textContent = resultado ?? '—';
    $('btnCopiar').style.display = $('btnLimpar').style.display = resultado == null ? 'none' : 'grid';
  }
  $('btnLimpar').onclick = () => { resultado = null; formato = null; render(); };
  $('btnCopiar').onclick = async () => {
    try { await navigator.clipboard.writeText(resultado); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = resultado; document.body.appendChild(t);
      t.select(); document.execCommand('copy'); t.remove();
    }
    snack('Copiado!');
  };

  let snackT;
  function snack(msg) {
    const s = $('snack'); s.textContent = msg; s.classList.add('on');
    clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove('on'), 2000);
  }

  // ---------- Câmera ----------
  async function start() {
    await initNative();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      track = stream.getVideoTracks()[0];
      caps = track.getCapabilities ? track.getCapabilities() : {};
      hwZoom = !!(caps.zoom && caps.zoom.max > caps.zoom.min);
      // foco contínuo, se suportado
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }
      requestAnimationFrame(loop);
    } catch (e) {
      const el = $('erro'); el.style.display = 'flex';
      el.textContent = 'Não foi possível acessar a câmera. Permita o acesso e abra a página em HTTPS (ou localhost).';
    }
  }
  start();
})();
</script>
</body>
</html>
