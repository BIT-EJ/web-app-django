<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Código de Barras</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .scanner {
      width: 100%;
      max-width: 600px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      border: 2px solid #333;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      display: block;
    }

    .scan-line {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 50%;
      height: 2px;
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88;
      pointer-events: none;
    }

    .result {
      margin-top: 25px;
      width: 100%;
      max-width: 600px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      background: #202228;
      border-radius: 12px;
      border: 1px solid #383b44;
    }

    .result-label {
      font-size: 13px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #barcode {
      font-size: clamp(22px, 6vw, 36px);
      font-weight: bold;
      overflow-wrap: anywhere;
      color: #00ff88;
    }

    #status {
      margin-top: 15px;
      color: #aaa;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 13px 22px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #00cc77;
      color: #07140e;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #stop {
      background: #353943;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Leitor de Código de Barras</h1>

  <div class="scanner">
    <video id="camera" autoplay muted playsinline></video>
    <div class="scan-line"></div>
  </div>

  <div class="result">
    <span class="result-label">Código identificado</span>
    <span id="barcode">Aguardando leitura...</span>
  </div>

  <p id="status">Câmera desligada</p>

  <div class="buttons">
    <button id="start">Iniciar câmera</button>
    <button id="stop" disabled>Parar câmera</button>
    <button id="clear">Limpar</button>
  </div>

  <script type="module">
    import {
      BrowserMultiFormatReader,
      BarcodeFormat,
      DecodeHintType
    } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm';

    const video = document.getElementById('camera');
    const barcode = document.getElementById('barcode');
    const status = document.getElementById('status');

    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');
    const clearButton = document.getElementById('clear');

    const hints = new Map();
    hints.set(DecodeHintType.POSSIBLE_FORMATS, [
      BarcodeFormat.EAN_13,
      BarcodeFormat.EAN_8,
      BarcodeFormat.UPC_A,
      BarcodeFormat.UPC_E,
      BarcodeFormat.CODE_128,
      BarcodeFormat.CODE_39,
      BarcodeFormat.ITF,
      BarcodeFormat.CODABAR
    ]);

    const reader = new BrowserMultiFormatReader(hints, {
      delayBetweenScanAttempts: 100
    });

    let stream = null;
    let controls = null;
    let starting = false;

    let lastCode = '';
    let lastReadTime = 0;

    async function getCameraStream() {
      // Verifica se o navegador bloqueou por falta de HTTPS
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Acesso à câmera indisponível. Certifique-se de usar HTTPS ou localhost.');
      }

      try {
        // 1ª tentativa: Câmera traseira em Alta Definição (Ideal para celulares)
        return await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
      } catch (err1) {
        try {
          // 2ª tentativa: Apenas preferência por câmera traseira sem resolução fixa
          return await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: 'environment' } }
          });
        } catch (err2) {
          // 3ª tentativa: Qualquer câmera disponível (Fallback para notebooks/desktops)
          return await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: true
          });
        }
      }
    }

    async function startCamera() {
      if (starting || stream) return;

      starting = true;
      startButton.disabled = true;
      status.textContent = 'Solicitando acesso à câmera...';
      barcode.textContent = 'Aguardando leitura...';

      try {
        stream = await getCameraStream();

        // Tenta configurar foco contínuo se suportado
        const track = stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            await track.applyConstraints({
              advanced: [{ focusMode: 'continuous' }]
            });
          } catch (e) {
            console.log('Foco contínuo não suportado neste dispositivo.');
          }
        }

        status.textContent = 'Procurando códigos de barras...';

        // Usa decodeFromStream para evitar conflito de controle do elemento <video>
        controls = await reader.decodeFromStream(
          stream,
          video,
          (result, error) => {
            if (result) {
              const code = result.getText();
              const now = Date.now();

              if (code === lastCode && now - lastReadTime < 2000) {
                return;
              }

              lastCode = code;
              lastReadTime = now;

              barcode.textContent = code;
              status.textContent = 'Código detectado com sucesso!';

              if (navigator.vibrate) {
                navigator.vibrate(100);
              }
            }
          }
        );

        stopButton.disabled = false;

      } catch (error) {
        console.error('Erro ao iniciar câmera:', error);
        stopCamera(false); // Limpa recursos sem apagar a mensagem de erro
        status.textContent = 'Erro: ' + (error.message || 'Permissão negada ou câmera não encontrada');
        barcode.textContent = 'Falha ao iniciar';
      } finally {
        starting = false;
      }
    }

    function stopCamera(updateStatus = true) {
      if (controls) {
        controls.stop();
        controls = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      startButton.disabled = false;
      stopButton.disabled = true;

      if (updateStatus) {
        status.textContent = 'Câmera desligada';
      }
    }

    function clearResult() {
      barcode.textContent = 'Aguardando leitura...';
      lastCode = '';
      lastReadTime = 0;
      status.textContent = stream
        ? 'Procurando códigos de barras...'
        : 'Câmera desligada';
    }

    startButton.addEventListener('click', startCamera);
    stopButton.addEventListener('click', () => stopCamera(true));
    clearButton.addEventListener('click', clearResult);

    window.addEventListener('pagehide', () => stopCamera(true));
  </script>

</body>
</html>
