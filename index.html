<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de código de barras</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --card:#fff; --fg:#14171c; --muted:#6b7280; --accent:#2563eb; --ok:#15803d; --okbg:#dcfce7; --err:#b91c1c; --errbg:#fee2e2; --bd:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --card:#1a1f27; --fg:#eef1f5; --muted:#9aa3b0; --accent:#60a5fa; --ok:#86efac; --okbg:#14301f; --err:#fca5a5; --errbg:#3b1616; --bd:#2b323d; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; justify-content:center; padding:20px; }
  main { width:100%; max-width:480px; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:1.3rem; margin:8px 0 0; }
  p.sub { margin:0; color:var(--muted); font-size:.95rem; }
  .btn { display:block; text-align:center; background:var(--accent); color:#fff; font-weight:600; font-size:1.1rem; padding:18px; border-radius:14px; cursor:pointer; border:0; width:100%; }
  .btn.sec { background:transparent; color:var(--accent); border:1.5px solid var(--accent); font-size:1rem; padding:12px; }
  input[type=file] { display:none; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:16px; }
  #preview { width:100%; border-radius:10px; display:none; max-height:50vh; object-fit:contain; background:#000; }
  #status { font-size:.95rem; color:var(--muted); }
  .res { border-radius:14px; padding:16px; display:none; word-break:break-all; }
  .res.ok { background:var(--okbg); color:var(--ok); }
  .res.fail { background:var(--errbg); color:var(--err); }
  .res .lbl { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; opacity:.85; }
  .res .val { font-size:1.5rem; font-weight:700; margin:4px 0 10px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .res .fmt { font-size:.9rem; margin-bottom:10px; }
  .res button { margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>Leitor de código de barras</h1>
  <p class="sub">Toque no botão, tire a foto com a câmera do celular e a leitura aparece automaticamente.</p>

  <label class="btn" for="cam">📷 Tirar foto</label>
  <input id="cam" type="file" accept="image/*" capture="environment">

  <div class="card">
    <img id="preview" alt="Foto tirada">
    <div id="status">Aguardando foto…</div>
  </div>

  <div id="ok" class="res ok">
    <div class="lbl">Leitura</div>
    <div class="val" id="val"></div>
    <div class="fmt" id="fmt"></div>
    <button class="btn sec" id="copy" type="button">Copiar</button>
  </div>

  <div id="fail" class="res fail">
    <strong>Falha ao ler o código de barras.</strong><br>
    <span style="font-size:.9rem">Tente de novo: chegue mais perto, deixe o código nítido, bem iluminado e sem reflexo, ocupando boa parte da foto.</span>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const input = $('cam'), preview = $('preview'), statusEl = $('status');
  const okBox = $('ok'), failBox = $('fail');
  const tick = () => new Promise(r => setTimeout(r, 0));

  const NATIVE_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code','data_matrix','pdf417','aztec'];
  let nativeDetector = null;
  async function getNative() {
    if (nativeDetector !== null) return nativeDetector;
    nativeDetector = false;
    try {
      if ('BarcodeDetector' in window) {
        const sup = await BarcodeDetector.getSupportedFormats();
        const fmts = NATIVE_FORMATS.filter(f => sup.includes(f));
        if (fmts.length) nativeDetector = new BarcodeDetector({ formats: fmts });
      }
    } catch (e) { nativeDetector = false; }
    return nativeDetector;
  }

  // ZXing setup
  let zxReader = null;
  function getZX() {
    if (zxReader !== null) return zxReader;
    zxReader = false;
    if (window.ZXing) {
      const Z = window.ZXing, hints = new Map();
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
        Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E,
        Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.CODE_93, Z.BarcodeFormat.ITF,
        Z.BarcodeFormat.CODABAR, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.DATA_MATRIX,
        Z.BarcodeFormat.PDF_417, Z.BarcodeFormat.AZTEC
      ]);
      zxReader = new Z.MultiFormatReader();
      zxReader.setHints(hints);
    }
    return zxReader;
  }

  function zxDecode(canvas) {
    const Z = window.ZXing, reader = getZX();
    if (!reader) return null;
    const lum = new Z.HTMLCanvasElementLuminanceSource(canvas);
    for (const Bin of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]) {
      try {
        const r = reader.decode(new Z.BinaryBitmap(new Bin(lum)));
        return { text: r.getText(), format: Z.BarcodeFormat[r.getBarcodeFormat()] };
      } catch (e) { /* não encontrou nessa variante */ }
    }
    return null;
  }

  // Monta uma variante da imagem: escala, recorte, rotação, filtro
  function makeCanvas(img, maxSide, crop, rot, filter) {
    const sw = img.naturalWidth, sh = img.naturalHeight;
    const cw = Math.round(sw * crop), ch = Math.round(sh * crop);
    const cx = Math.round((sw - cw) / 2), cy = Math.round((sh - ch) / 2);
    const k = Math.min(1, maxSide / Math.max(cw, ch));
    let w = Math.max(1, Math.round(cw * k)), h = Math.max(1, Math.round(ch * k));
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d', { willReadFrequently: true });
    if (rot === 90) { c.width = h; c.height = w; ctx.translate(h, 0); ctx.rotate(Math.PI / 2); }
    else { c.width = w; c.height = h; }
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, cx, cy, cw, ch, 0, 0, w, h);
    if (filter !== 'none') applyFilter(c, filter);
    return c;
  }

  function applyFilter(c, filter) {
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const id = ctx.getImageData(0, 0, c.width, c.height), d = id.data, n = d.length / 4;
    const g = new Uint8ClampedArray(n), hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) { const v = (d[i*4]*0.299 + d[i*4+1]*0.587 + d[i*4+2]*0.114) | 0; g[i] = v; hist[v]++; }
    if (filter === 'contrast') {
      let acc = 0, lo = 0, hi = 255;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= n * 0.02) { lo = i; break; } }
      acc = 0;
      for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= n * 0.02) { hi = i; break; } }
      const span = Math.max(1, hi - lo);
      for (let i = 0; i < n; i++) { const v = Math.max(0, Math.min(255, ((g[i] - lo) * 255 / span) | 0)); d[i*4] = d[i*4+1] = d[i*4+2] = v; }
    } else { // otsu
      let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
      let wB = 0, sB = 0, best = 0, th = 128;
      for (let t = 0; t < 256; t++) {
        wB += hist[t]; if (!wB) continue;
        const wF = n - wB; if (!wF) break;
        sB += t * hist[t];
        const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
        if (v > best) { best = v; th = t; }
      }
      for (let i = 0; i < n; i++) { const v = g[i] > th ? 255 : 0; d[i*4] = d[i*4+1] = d[i*4+2] = v; }
    }
    ctx.putImageData(id, 0, 0);
  }

  async function decodeImage(img) {
    const native = await getNative();
    const scales = [1600, 1000, 2400, 700];
    const filters = ['none', 'contrast', 'otsu'];
    const crops = [1, 0.7];
    const rots = [0, 90];
    const total = scales.length * filters.length * crops.length * rots.length;
    let i = 0;
    for (const s of scales) for (const f of filters) for (const cr of crops) for (const rot of rots) {
      i++;
      statusEl.textContent = 'Lendo… tentativa ' + i + ' de ' + total;
      await tick();
      const c = makeCanvas(img, s, cr, rot, f);
      if (native) {
        try {
          const res = await native.detect(c);
          if (res && res.length) return { text: res[0].rawValue, format: String(res[0].format).toUpperCase(), engine: 'nativo' };
        } catch (e) {}
      }
      const z = zxDecode(c);
      if (z) return { text: z.text, format: z.format, engine: 'ZXing' };
    }
    return null;
  }

  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    okBox.style.display = failBox.style.display = 'none';
    const url = URL.createObjectURL(file);
    preview.src = url; preview.style.display = 'block';
    statusEl.textContent = 'Carregando foto…';
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      if (!getZX() && !(await getNative())) {
        statusEl.textContent = 'Erro: não foi possível carregar o leitor (verifique a internet).';
        failBox.style.display = 'block';
        return;
      }
      const t0 = performance.now();
      const r = await decodeImage(img);
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      if (r) {
        $('val').textContent = r.text;
        $('fmt').textContent = 'Formato: ' + r.format.replace(/_/g, '-') + ' · ' + r.engine + ' · ' + secs + 's';
        okBox.style.display = 'block';
        statusEl.textContent = 'Leitura concluída.';
      } else {
        failBox.style.display = 'block';
        statusEl.textContent = 'Não foi possível ler (' + secs + 's).';
      }
    } catch (e) {
      statusEl.textContent = 'Erro ao processar a foto.';
      failBox.style.display = 'block';
    } finally {
      input.value = ''; // permite tirar outra foto igual
    }
  });

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('val').textContent); $('copy').textContent = 'Copiado ✓'; }
    catch (e) { $('copy').textContent = 'Selecione e copie manualmente'; }
    setTimeout(() => $('copy').textContent = 'Copiar', 1800);
  });
})();
</script>
</body>
</html>
