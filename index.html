<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leitor de Patrimônio</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root {
    --primary-inv: #cfbcff;   /* inversePrimary (deepPurple) */
    --surface: #fef7ff;
    --on-surface: #1d1b20;
    --label: #49454f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; font-family: Roboto, system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    background: var(--primary-inv); color: var(--on-surface);
    height: 56px; padding: 0 4px 0 16px; padding-top: env(safe-area-inset-top, 0px);
    box-sizing: content-box; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  header h1 { font-size: 22px; font-weight: 400; margin: 0; }
  .icon-btn { background: none; border: 0; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; color: var(--on-surface); display: grid; place-items: center; }
  .icon-btn:active { background: rgba(0,0,0,.12); }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

  #camera { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
  #zoom {
    position: absolute; z-index: 2; top: 12px; right: 12px; background: rgba(0,0,0,.54); color: #fff;
    padding: 4px 10px; border-radius: 12px; font-size: 14px; pointer-events: none;
  }
  #shade { position: absolute; inset: 0; display: grid; pointer-events: none;
    grid-template-columns: 1fr min(88%, 560px) 1fr; grid-template-rows: 1fr min(34%, 220px) 1fr; }
  #shade > div { background: rgba(0,0,0,.55); }
  #shade > #roi { background: transparent; position: relative; outline: 2px solid rgba(255,255,255,.35); border-radius: 0; }
  #roi i { position: absolute; width: 26px; height: 26px; border: 4px solid #d0bcff; }
  #roi i:nth-child(1) { left: -4px; top: -4px; border-right: 0; border-bottom: 0; }
  #roi i:nth-child(2) { right: -4px; top: -4px; border-left: 0; border-bottom: 0; }
  #roi i:nth-child(3) { left: -4px; bottom: -4px; border-right: 0; border-top: 0; }
  #roi i:nth-child(4) { right: -4px; bottom: -4px; border-left: 0; border-top: 0; }
  #erro { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 24px; }

  #painel {
    background: var(--surface); width: 100%; flex-shrink: 0;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center;
  }
  #painel .txt { flex: 1; min-width: 0; }
  #label { font-size: 12px; font-weight: 500; letter-spacing: .5px; color: var(--on-surface); }
  #valor { font-size: 22px; margin-top: 4px; color: var(--on-surface); user-select: text; -webkit-user-select: text; word-break: break-all; }
  #painel .icon-btn { color: var(--label); }

  #snack {
    position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    background: #322f35; color: #f5eff7; padding: 14px 16px; border-radius: 4px; font-size: 14px;
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none;
  }
  #snack.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Leitor de Patrimônio</h1>
    <button class="icon-btn" id="btnFlash" aria-label="Lanterna">
      <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
    </button>
  </header>

  <div id="camera">
    <video id="video" playsinline muted autoplay disablepictureinpicture></video>
    <div id="shade"><div></div><div></div><div></div><div></div><div id="roi"><i></i><i></i><i></i><i></i></div><div></div><div></div><div></div><div></div></div>
    <div id="zoom">Zoom 0%</div>
    <div id="erro"></div>
  </div>

  <div id="painel">
    <div class="txt">
      <div id="label">Aponte para um código de barras</div>
      <div id="valor">—</div>
    </div>
    <button class="icon-btn" id="btnCopiar" title="Copiar" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
    </button>
    <button class="icon-btn" id="btnLimpar" title="Limpar" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
</div>
<div id="snack">Copiado!</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), cam = $('camera');

  // ---------- Estado ----------
  let zoom = 0.0, baseZoom = 0.0;          // 0.0 a 1.0, igual ao app Flutter
  let resultado = null, formato = null;
  let track = null, caps = {};
  let hwZoom = false, torchOn = false;
  const DIGITAL_MAX = 4;                   // zoom digital máximo (quando a câmera não tem zoom por hardware)

  // ---------- Leitores (todos os formatos) ----------
  // Principal: zxing-wasm (zxing-cpp) rodando num Web Worker, fora da thread da tela,
  // então a câmera não trava. Reserva: BarcodeDetector nativo e ZXing-js na thread principal.
  const Z = window.ZXing;
  const hints = new Map();
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const zxing = new Z.MultiFormatReader();
  zxing.setHints(hints);

  const WASM_URLS = [
    'https://cdn.jsdelivr.net/npm/zxing-wasm@2.1.0/dist/es/reader/index.js',
    'https://cdn.jsdelivr.net/npm/zxing-wasm@2/reader/+esm',
    'https://esm.sh/zxing-wasm@2/reader'
  ];
  const WASM_OPTS = { formats: [], tryHarder: true, tryRotate: true, tryInvert: true,
                      tryDownscale: true, maxNumberOfSymbols: 1 };

  // ----- código do worker (roda fora da thread da tela) -----
  function workerMain(urls, opts) {
    let mod = null, cv = null, cx = null;
    const ready = (async () => {
      for (const u of urls) {
        try { const m = await import(u); if (m.readBarcodes) { mod = m; return true; } } catch (e) {}
      }
      return false;
    })();

    // ---- filtros de realce ----
    const toGray = (d) => {
      const n = d.width * d.height, g = new Uint8ClampedArray(n), px = d.data;
      for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (px[j] * 77 + px[j + 1] * 150 + px[j + 2] * 29) >> 8;
      return g;
    };
    const toImg = (g, w, h) => {
      const d = new Uint8ClampedArray(w * h * 4);
      for (let i = 0, j = 0; i < g.length; i++, j += 4) { d[j] = d[j + 1] = d[j + 2] = g[i]; d[j + 3] = 255; }
      return new ImageData(d, w, h);
    };
    // estica o contraste (ignora 1% mais escuro / 1% mais claro)
    const stretch = (g) => {
      const hist = new Uint32Array(256); for (let i = 0; i < g.length; i++) hist[g[i]]++;
      const cut = g.length * 0.01; let lo = 0, hi = 255, acc = 0;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > cut) { lo = i; break; } }
      acc = 0;
      for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > cut) { hi = i; break; } }
      if (hi - lo < 10) return g;
      const out = new Uint8ClampedArray(g.length), k = 255 / (hi - lo);
      for (let i = 0; i < g.length; i++) out[i] = (g[i] - lo) * k;
      return out;
    };
    // nitidez (realça bordas das barras / módulos do QR)
    const sharpen = (g, w, h) => {
      const o = new Uint8ClampedArray(g);
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        o[i] = 5 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
      }
      return o;
    };
    // suavização 3x3 (tira ruído e serrilhado da imagem pixelada)
    const blur = (g, w, h) => {
      const o = new Uint8ClampedArray(g);
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        o[i] = (g[i - w - 1] + g[i - w] + g[i - w + 1] + g[i - 1] + g[i] + g[i + 1] + g[i + w - 1] + g[i + w] + g[i + w + 1]) / 9;
      }
      return o;
    };
    // binarização adaptativa (limiar local: funciona com sombra / luz desigual)
    const adaptive = (g, w, h, win, C) => {
      const W = w + 1, I = new Uint32Array(W * (h + 1));
      for (let y = 0; y < h; y++) {
        let row = 0;
        for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W + x + 1] = I[y * W + x + 1] + row; }
      }
      const r = win >> 1, o = new Uint8ClampedArray(g.length);
      for (let y = 0; y < h; y++) {
        const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
        for (let x = 0; x < w; x++) {
          const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
          const sum = I[y1 * W + x1] - I[y0 * W + x1] - I[y1 * W + x0] + I[y0 * W + x0];
          const mean = sum / ((x1 - x0) * (y1 - y0));
          o[y * w + x] = g[y * w + x] < mean - C ? 0 : 255;
        }
      }
      return o;
    };
    // binarização global (Otsu)
    const otsu = (g) => {
      const hist = new Uint32Array(256); for (let i = 0; i < g.length; i++) hist[g[i]]++;
      let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
      let sB = 0, wB = 0, best = 0, th = 128;
      for (let t = 0; t < 256; t++) {
        wB += hist[t]; if (!wB) continue;
        const wF = g.length - wB; if (!wF) break;
        sB += t * hist[t];
        const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
        if (v > best) { best = v; th = t; }
      }
      const o = new Uint8ClampedArray(g.length);
      for (let i = 0; i < g.length; i++) o[i] = g[i] > th ? 255 : 0;
      return o;
    };

    const tryRead = async (img) => {
      const r = await mod.readBarcodes(img, opts);
      return r.find(x => x.text && x.isValid !== false) || null;
    };

    // ---- foco no PRETO ----
    // Canal "valor" = max(R,G,B): preto fica ~0 e qualquer cor de fundo (vermelho, verde,
    // azul, amarelo...) fica clara. Barras pretas viram o único escuro da imagem.
    const toV = (d) => {
      const n = d.width * d.height, g = new Uint8ClampedArray(n), px = d.data;
      for (let i = 0, j = 0; i < n; i++, j += 4) {
        const r = px[j], gg = px[j + 1], b = px[j + 2];
        g[i] = r > gg ? (r > b ? r : b) : (gg > b ? gg : b);
      }
      return g;
    };
    const oddWin = (w, h) => { let win = Math.max(25, Math.round(Math.min(w, h) / 5)); return win % 2 ? win : win + 1; };

    // Localiza onde está o código de barras dentro da caixa: região com muitos "degraus"
    // de claro/escuro numa direção só (barras). Serve para código distante e pequeno.
    const locate = (v, w, h) => {
      const d = Math.max(1, Math.floor(Math.max(w, h) / 480));
      const sw = Math.floor(w / d), sh = Math.floor(h / d);
      if (sw < 32 || sh < 16) return null;
      const sm = new Uint8ClampedArray(sw * sh);
      for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
        let t = 0; for (let j = 0; j < d; j++) for (let i = 0; i < d; i++) t += v[(y * d + j) * w + x * d + i];
        sm[y * sw + x] = t / (d * d);
      }
      const B = 8, bw = Math.ceil(sw / B), bh = Math.ceil(sh / B);
      const sx = new Float32Array(bw * bh), sy = new Float32Array(bw * bh);
      for (let y = 1; y < sh - 1; y++) for (let x = 1; x < sw - 1; x++) {
        const k = ((y / B) | 0) * bw + ((x / B) | 0);
        sx[k] += Math.abs(sm[y * sw + x + 1] - sm[y * sw + x - 1]);
        sy[k] += Math.abs(sm[(y + 1) * sw + x] - sm[(y - 1) * sw + x]);
      }
      let best = null;
      for (const vert of [true, false]) {                    // barras verticais ou código girado
        const sc = new Float32Array(bw * bh); let mx = 0;
        for (let k = 0; k < sc.length; k++) { sc[k] = vert ? sx[k] - sy[k] : sy[k] - sx[k]; if (sc[k] > mx) mx = sc[k]; }
        if (mx < B * B * 8) continue;                        // quase sem gradiente: nada a achar
        const thr = Math.max(mx * 0.25, B * B * 4), seen = new Uint8Array(sc.length);
        for (let s0 = 0; s0 < sc.length; s0++) {
          if (seen[s0] || sc[s0] < thr) continue;
          let tot = 0, x0 = bw, y0 = bh, x1 = 0, y1 = 0; const q = [s0]; seen[s0] = 1;
          while (q.length) {
            const k = q.pop(), cx_ = k % bw, cy_ = (k / bw) | 0; tot += sc[k];
            if (cx_ < x0) x0 = cx_; if (cx_ > x1) x1 = cx_; if (cy_ < y0) y0 = cy_; if (cy_ > y1) y1 = cy_;
            for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
              const nx = cx_ + dx, ny = cy_ + dy; if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) continue;
              const nk = ny * bw + nx; if (!seen[nk] && sc[nk] >= thr) { seen[nk] = 1; q.push(nk); }
            }
          }
          if (!best || tot > best.tot) best = { tot, x0, y0, x1, y1 };
        }
      }
      if (!best) return null;
      const f = B * d;
      let x = best.x0 * f, y = best.y0 * f, cw = (best.x1 - best.x0 + 1) * f, ch = (best.y1 - best.y0 + 1) * f;
      const px_ = Math.max(12, cw * 0.25), py_ = Math.max(12, ch * 0.35);
      x = Math.max(0, x - px_); y = Math.max(0, y - py_);
      cw = Math.min(w - x, cw + 2 * px_); ch = Math.min(h - y, ch + 2 * py_);
      if (cw < 40 || ch < 20 || (cw * ch) > 0.85 * w * h) return null;   // não ajuda se já é quase tudo
      return { x: Math.round(x), y: Math.round(y), w: Math.round(cw), h: Math.round(ch) };
    };

    let cv2 = null, cx2 = null;
    const cut = (x, y, cw, ch) => {           // recorta e amplia (até 6x) a região do código
      const k = Math.max(1, Math.min(6, 1600 / Math.max(cw, ch)));
      const tw = Math.round(cw * k), th = Math.round(ch * k);
      if (!cv2) { cv2 = new OffscreenCanvas(tw, th); cx2 = cv2.getContext('2d', { willReadFrequently: true }); }
      cv2.width = tw; cv2.height = th;
      cx2.imageSmoothingEnabled = true; cx2.imageSmoothingQuality = 'high';
      cx2.drawImage(cv, x, y, cw, ch, 0, 0, tw, th);
      return cx2.getImageData(0, 0, tw, th);
    };

    // variações de realce em cima de um canal (preto = barras)
    const variantes = async (v, w, h) => {
      const g = stretch(v);
      let b = await tryRead(toImg(sharpen(g, w, h), w, h)); if (b) return b;
      const sm = blur(g, w, h), win = oddWin(w, h);
      b = await tryRead(toImg(adaptive(sm, w, h, win, 6), w, h)); if (b) return b;
      b = await tryRead(toImg(adaptive(g, w, h, win, 12), w, h)); if (b) return b;
      return await tryRead(toImg(otsu(sm), w, h));
    };

    onmessage = async (e) => {
      const { id, bitmap } = e.data;
      try {
        if (!(await ready)) { bitmap.close(); postMessage({ id, error: 'nowasm' }); return; }
        const w = bitmap.width, h = bitmap.height;
        if (!cv || cv.width !== w || cv.height !== h) {
          cv = new OffscreenCanvas(w, h);
          cx = cv.getContext('2d', { willReadFrequently: true });
        }
        cx.drawImage(bitmap, 0, 0); bitmap.close();
        const raw = cx.getImageData(0, 0, w, h);

        // 1) imagem ampliada, sem filtro
        let b = await tryRead(raw);
        if (!b) {
          const v = toV(raw);
          // 2) acha o código dentro da caixa, recorta e amplia mais (código longe)
          const loc = locate(v, w, h);
          if (loc) {
            const crop = cut(loc.x, loc.y, loc.w, loc.h);
            b = await tryRead(crop);
            if (!b) b = await variantes(toV(crop), crop.width, crop.height);
          }
          // 3) caixa inteira olhando só o preto (fundo colorido some)
          if (!b) b = await variantes(v, w, h);
          // 4) último recurso: luminância comum (QR de baixa qualidade)
          if (!b) {
            const g = blur(stretch(toGray(raw)), w, h);
            b = await tryRead(toImg(adaptive(g, w, h, oddWin(w, h), 6), w, h));
          }
        }
        postMessage({ id, r: b ? { valor: b.text, formato: b.format } : null });
      } catch (err) { postMessage({ id, error: String(err) }); }
    };
  }

  // nomes de formato iguais aos do Flutter
  const FLUTTER_FMT = { qrcode: 'qrCode', microqrcode: 'microQrCode', upca: 'upcA', upce: 'upcE',
    datamatrix: 'dataMatrix', databar: 'dataBar', databarexpanded: 'dataBarExpanded', rmqrcode: 'rmqrCode' };
  const fmtName = n => {
    const k = String(n).toLowerCase().replace(/[^a-z0-9]/g, '');
    return FLUTTER_FMT[k] || k;
  };

  let worker = null, workerOk = false, jobId = 0;
  const pendentes = new Map();
  let wasm = null;                       // reserva na thread principal
  async function initWasmMain() {
    for (const u of WASM_URLS) {
      try { const m = await import(u); if (m.readBarcodes) { wasm = m; return; } } catch (e) {}
    }
  }
  function falhaWorker() {
    workerOk = false;
    for (const [, res] of pendentes) res(null);
    pendentes.clear();
    if (!wasm) initWasmMain();
  }
  function initWorker() {
    try {
      const src = `(${workerMain.toString()})(${JSON.stringify(WASM_URLS)}, ${JSON.stringify(WASM_OPTS)})`;
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = (e) => {
        const { id, r, error } = e.data;
        const res = pendentes.get(id);
        if (error === 'nowasm') return falhaWorker();
        if (res) { pendentes.delete(id); res(r ? { valor: r.valor, formato: fmtName(r.formato) } : null); }
      };
      worker.onerror = falhaWorker;
      workerOk = true;
    } catch (e) { falhaWorker(); }
  }

  let nativeDetector = null;
  async function initNative() {
    if (!('BarcodeDetector' in window)) return;
    try {
      nativeDetector = new BarcodeDetector({ formats: await BarcodeDetector.getSupportedFormats() });
    } catch (e) { nativeDetector = null; }
  }

  // ---------- Área de leitura: SÓ o que está dentro da caixa central ----------
  const roiEl = $('roi');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function roiVideoRect() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const cr = cam.getBoundingClientRect(), rr = roiEl.getBoundingClientRect();
    if (!vw || !vh || !cr.width) return null;
    const s = Math.max(cr.width / vw, cr.height / vh);            // object-fit: cover
    const f = hwZoom ? 1 : 1 + zoom * (DIGITAL_MAX - 1);          // zoom digital (CSS scale)
    const conv = (x, y) => [
      vw / 2 + ((x - cr.left - cr.width / 2) / f) / s,
      vh / 2 + ((y - cr.top - cr.height / 2) / f) / s
    ];
    let [x0, y0] = conv(rr.left, rr.top), [x1, y1] = conv(rr.right, rr.bottom);
    x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0));
    x1 = Math.min(vw, Math.round(x1)); y1 = Math.min(vh, Math.round(y1));
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  // fator de escala: amplia se a caixa for pequena na imagem, limita se for enorme
  const fatorEscala = (r) => { const m = Math.max(r.w, r.h); return m < 1400 ? Math.min(4, 1400 / m) : Math.min(1, 1800 / m); };

  function roiToCanvas(r) {
    const k = fatorEscala(r);
    canvas.width = Math.round(r.w * k); canvas.height = Math.round(r.h * k);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, canvas.width, canvas.height);
  }

  async function lerFrame() {
    if (!video.videoWidth) return null;
    const r = roiVideoRect();
    if (!r || r.w < 8 || r.h < 8) return null;

    // 1) Worker (não trava a tela)
    if (workerOk) {
      let bmp;
      try {
        const k = fatorEscala(r);
        bmp = await createImageBitmap(video, r.x, r.y, r.w, r.h, {
          resizeWidth: Math.round(r.w * k), resizeHeight: Math.round(r.h * k), resizeQuality: 'high'
        });
      } catch (e) {
        roiToCanvas(r);
        try { bmp = await createImageBitmap(canvas); } catch (e2) { return null; }
      }
      return new Promise(res => {
        const id = ++jobId;
        const t = setTimeout(() => { if (pendentes.delete(id)) res(null); }, 8000);
        pendentes.set(id, v => { clearTimeout(t); res(v); });
        worker.postMessage({ id, bitmap: bmp }, [bmp]);
      });
    }

    // 2) Reserva na thread principal
    roiToCanvas(r);
    if (wasm) {
      try {
        const res = await wasm.readBarcodes(ctx.getImageData(0, 0, canvas.width, canvas.height), WASM_OPTS);
        for (const b of res) if (b.text && b.isValid !== false) return { valor: b.text, formato: fmtName(b.format) };
        return null;
      } catch (e) { wasm = null; }
    }
    if (nativeDetector) {
      try {
        const d = await nativeDetector.detect(canvas);
        for (const b of d) if (b.rawValue) return { valor: b.rawValue, formato: fmtName(b.format) };
        return null;
      } catch (e) { nativeDetector = null; }
    }
    try {
      const lum = new Z.HTMLCanvasElementLuminanceSource(canvas);
      const res = zxing.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(lum)));
      const t = res.getText();
      if (t) return { valor: t, formato: fmtName(Z.BarcodeFormat[res.getBarcodeFormat()]) };
    } catch (e) { /* NotFound */ }
    return null;
  }

  // ---------- Detecção (equivale ao onDetect) ----------
  // Precisão: só aceita um código novo depois de lê-lo 2 vezes iguais em até 1,5 s,
  // o que elimina leituras erradas ocasionais.
  let pend = { v: null, t: 0 };
  function onDetect(valor, fmt) {
    if (!valor) return;
    if (valor === resultado) { pend.v = null; return; }
    const agora = performance.now();
    if (pend.v === valor && agora - pend.t < 1500) {
      pend.v = null;
      if (navigator.vibrate) navigator.vibrate(200);   // vibra ao ler um código novo
      resultado = valor; formato = fmt;
      render();
    } else {
      pend = { v: valor, t: agora };
    }
  }

  // ~8 análises por segundo, só da área central, fora da thread principal.
  const INTERVALO_MS = 120;
  let busy = false, last = 0;
  async function processar() {
    busy = true;
    try {
      const r = await lerFrame();
      if (r) onDetect(r.valor, r.formato);
    } finally { busy = false; }
  }
  function loop(ts) {
    const agora = ts || performance.now();
    if (!busy && agora - last >= INTERVALO_MS) { last = agora; processar(); }
    if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(loop);
    else requestAnimationFrame(loop);
  }

  // ---------- Zoom ----------
  function setZoom(novo) {
    const z = Math.min(1, Math.max(0, novo));
    if (z === zoom) return;
    zoom = z;
    if (hwZoom && track) {
      const { min, max } = caps.zoom;
      track.applyConstraints({ advanced: [{ zoom: min + z * (max - min) }] }).catch(() => {});
    } else {
      video.style.transform = `scale(${1 + z * (DIGITAL_MAX - 1)})`;
    }
    $('zoom').textContent = `Zoom ${Math.round(zoom * 100)}%`;
  }

  // gesto de pinça (onScaleStart / onScaleUpdate)
  const ptrs = new Map();
  let startDist = 0;
  const dist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  cam.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cam.setPointerCapture(e.pointerId);
    if (ptrs.size === 2) { startDist = dist(); baseZoom = zoom; }
  });
  cam.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && startDist > 0) {
      const scale = dist() / startDist;
      setZoom(baseZoom + (scale - 1) * 0.35);
    }
  });
  const up = e => { ptrs.delete(e.pointerId); startDist = 0; };
  cam.addEventListener('pointerup', up);
  cam.addEventListener('pointercancel', up);
  // scroll do mouse (desktop)
  cam.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom - Math.sign(e.deltaY) * 0.05); }, { passive: false });

  // toque rápido = refoca (ajuda a ler de mais longe)
  cam.addEventListener('click', async () => {
    if (!track || !caps.focusMode) return;
    try {
      if (caps.focusMode.includes('single-shot')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
        setTimeout(() => {
          if (caps.focusMode.includes('continuous'))
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }, 1500);
      }
    } catch (e) {}
  });

  // ---------- Lanterna ----------
  $('btnFlash').onclick = async () => {
    if (!track || !caps.torch) return snack('Lanterna não disponível neste aparelho');
    torchOn = !torchOn;
    try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); }
    catch (e) { torchOn = !torchOn; snack('Não foi possível acionar a lanterna'); }
  };

  // ---------- Painel de resultado ----------
  function render() {
    $('label').textContent = resultado == null ? 'Aponte para um código de barras' : `Código lido (${formato || ''})`;
    $('valor').textContent = resultado ?? '—';
    $('btnCopiar').style.display = $('btnLimpar').style.display = resultado == null ? 'none' : 'grid';
  }
  $('btnLimpar').onclick = () => { resultado = null; formato = null; render(); };
  $('btnCopiar').onclick = async () => {
    try { await navigator.clipboard.writeText(resultado); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = resultado; document.body.appendChild(t);
      t.select(); document.execCommand('copy'); t.remove();
    }
    snack('Copiado!');
  };

  let snackT;
  function snack(msg) {
    const s = $('snack'); s.textContent = msg; s.classList.add('on');
    clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove('on'), 2000);
  }

  // ---------- Câmera ----------
  async function start() {
    await initNative();
    initWorker(); // zxing-wasm em Web Worker (carrega em segundo plano)
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: 30 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      track = stream.getVideoTracks()[0];
      caps = track.getCapabilities ? track.getCapabilities() : {};
      hwZoom = !!(caps.zoom && caps.zoom.max > caps.zoom.min);
      // foco contínuo, se suportado
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        const adv = { focusMode: 'continuous' };
        if (caps.pointsOfInterest) adv.pointsOfInterest = [{ x: 0.5, y: 0.5 }];  // foco no centro
        track.applyConstraints({ advanced: [adv] }).catch(() => {});
      }
      loop();
    } catch (e) {
      const el = $('erro'); el.style.display = 'flex';
      el.textContent = 'Não foi possível acessar a câmera. Permita o acesso e abra a página em HTTPS (ou localhost).';
    }
  }
  start();
})();
</script>
</body>
</html>
