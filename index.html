<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Código</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .scanner-box {
      width: 100%;
      max-width: 500px;
      height: 360px;
      background: #000;
      border: 2px solid #333;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      pointer-events: none;
    }

    .placeholder-text {
      color: #666;
      font-size: 14px;
      z-index: 1;
      pointer-events: none;
    }

    .result {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      background: #202228;
      border-radius: 12px;
      border: 1px solid #383b44;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-label {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #barcode {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: bold;
      color: #00ff88;
      overflow-wrap: anywhere;
    }

    #status {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }

    #action-btn {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #00cc77;
      color: #07140e;
      transition: background 0.2s, transform 0.1s;
    }

    #action-btn:active {
      transform: scale(0.98);
    }

    #action-btn.stop-mode {
      background: #ff4757;
      color: white;
    }

    #action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <h1>Leitor de Código</h1>

  <div class="scanner-box">
    <span class="placeholder-text" id="placeholder">Câmera desligada</span>
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="result">
    <span class="result-label">Código identificado</span>
    <span id="barcode">---</span>
  </div>

  <p id="status">Clique no botão abaixo para ler</p>

  <button id="action-btn">Iniciar Câmera</button>

  <script type="module">
    // Motor ZXing compilado em WebAssembly (mesmo motor C++ usado em apps nativos)
    import { BarcodeDetector } from 'https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js';

    const video = document.getElementById('camera');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('action-btn');
    const barcodeEl = document.getElementById('barcode');
    const statusEl = document.getElementById('status');
    const placeholderEl = document.getElementById('placeholder');

    const detector = new BarcodeDetector({
      formats: [
        'qr_code',
        'ean_13',
        'ean_8',
        'upc_a',
        'upc_e',
        'code_128',
        'code_39',
        'itf',
        'codabar'
      ]
    });

    let stream = null;
    let isScanning = false;
    let scanTimer = null;

    function clearOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawBoundingBox(cornerPoints) {
      if (!cornerPoints || cornerPoints.length < 4) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(cornerPoints[0].x, cornerPoints[0].y);
      for (let i = 1; i < cornerPoints.length; i++) {
        ctx.lineTo(cornerPoints[i].x, cornerPoints[i].y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function stopScanner(successMessage = null) {
      isScanning = false;

      if (scanTimer) {
        clearTimeout(scanTimer);
        scanTimer = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      clearOverlay();
      placeholderEl.style.display = 'block';

      statusEl.textContent = successMessage || 'Câmera parada';
      actionBtn.textContent = 'Iniciar Câmera';
      actionBtn.classList.remove('stop-mode');
      actionBtn.disabled = false;
    }

    async function scanLoop() {
      if (!isScanning || video.readyState < 2) {
        if (isScanning) scanTimer = setTimeout(scanLoop, 80);
        return;
      }

      try {
        // Analisa 100% do frame da câmera sem exigir centralização
        const barcodes = await detector.detect(video);

        if (barcodes.length > 0 && isScanning) {
          const found = barcodes[0];

          // Desenha o contorno verde exatamente onde o código foi achado na tela
          drawBoundingBox(found.cornerPoints);

          barcodeEl.textContent = found.rawValue;

          if (navigator.vibrate) {
            navigator.vibrate(100);
          }

          // Pequena pausa visual de 250ms para ver o contorno verde no código antes de fechar
          isScanning = false;
          setTimeout(() => {
            stopScanner(`Código lido (${found.format.toUpperCase()})!`);
          }, 250);
          return;
        }
      } catch (err) {
        console.error('Erro no frame:', err);
      }

      if (isScanning) {
        scanTimer = setTimeout(scanLoop, 80);
      }
    }

    async function getBestCameraStream() {
      // Pede Full HD (1080p) para permitir leitura a longa distância
      const highResConstraints = {
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      try {
        return await navigator.mediaDevices.getUserMedia(highResConstraints);
      } catch {
        return await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }
    }

    async function toggleScanner() {
      actionBtn.disabled = true;

      if (isScanning) {
        stopScanner();
        return;
      }

      barcodeEl.textContent = 'Aguardando...';
      statusEl.textContent = 'Abrindo câmera em alta definição...';
      placeholderEl.style.display = 'none';

      try {
        stream = await getBestCameraStream();
        video.srcObject = stream;
        await video.play();

        // Ativa foco contínuo e zoom leve (1.5x) se o aparelho suportar, ajudando na leitura de longe
        const track = stream.getVideoTracks()[0];
        if (track && track.getCapabilities && track.applyConstraints) {
          const caps = track.getCapabilities();
          const advanced = [];

          if (caps.focusMode && caps.focusMode.includes('continuous')) {
            advanced.push({ focusMode: 'continuous' });
          }

          if (advanced.length > 0) {
            track.applyConstraints({ advanced }).catch(() => {});
          }
        }

        isScanning = true;
        statusEl.textContent = 'Aponte a câmera para o código (qualquer posição)...';
        actionBtn.textContent = 'Parar Câmera';
        actionBtn.classList.add('stop-mode');
        actionBtn.disabled = false;

        scanLoop();

      } catch (err) {
        console.error('Erro ao iniciar câmera:', err);
        stopScanner('Erro: Permissão negada ou câmera indisponível.');
        barcodeEl.textContent = '---';
        actionBtn.textContent = 'Tentar Novamente';
      }
    }

    actionBtn.addEventListener('click', toggleScanner);
    window.addEventListener('pagehide', () => stopScanner());
  </script>

</body>
</html>
