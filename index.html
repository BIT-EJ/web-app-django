<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventário Patrimonial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-radius: 5px;
        }
        main {
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        #resultado {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sistema de Inventário Patrimonial</h1>
    </header>

    <main>
        <p>teste</p>
        <button id="btnProcessar" onclick="chamarBackend()">Clique aqui</button>
        <p id="resultado"></p>
    </main>

    <script>
        async function chamarBackend() {
            const botao = document.getElementById('btnProcessar');
            const resultado = document.getElementById('resultado');

            botao.disabled = true;
            resultado.innerText = 'Processando...';

            try {
                const response = await fetch('/api/processar');
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const dados = await response.json();
                resultado.innerText = dados.mensagem;
            } catch (erro) {
                console.error('Erro na requisição:', erro);
                resultado.innerText = 'Erro ao conectar com o backend Python.';
            } finally {
                botao.disabled = false;
            }
        }
    </script>

</body>
</html>
