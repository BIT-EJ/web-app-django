<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor de Código</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .scanner-box {
      width: 100%;
      max-width: 500px;
      height: 360px;
      background: #000;
      border: 2px solid #333;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      /* Impede que o navegador dê zoom na página inteira ao fazer pinça na câmera */
      touch-action: none;
      user-select: none;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }

    canvas {
      pointer-events: none;
    }

    .placeholder-text {
      color: #666;
      font-size: 14px;
      z-index: 1;
      pointer-events: none;
    }

    #zoom-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: #00ff88;
      border: 1px solid rgba(0, 255, 136, 0.4);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      z-index: 2;
      pointer-events: none;
      display: none;
    }

    .result {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      background: #202228;
      border-radius: 12px;
      border: 1px solid #383b44;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-label {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #barcode {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: bold;
      color: #00ff88;
      overflow-wrap: anywhere;
    }

    #status {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }

    #action-btn {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #00cc77;
      color: #07140e;
      transition: background 0.2s, transform 0.1s;
    }

    #action-btn:active {
      transform: scale(0.98);
    }

    #action-btn.stop-mode {
      background: #ff4757;
      color: white;
    }

    #action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <h1>Leitor de Código</h1>

  <div class="scanner-box" id="scanner-box">
    <span class="placeholder-text" id="placeholder">Câmera desligada</span>
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <span id="zoom-badge">1.0x</span>
  </div>

  <div class="result">
    <span class="result-label">Código identificado</span>
    <span id="barcode">---</span>
  </div>

  <p id="status">Clique no botão abaixo para ler</p>

  <button id="action-btn">Iniciar Câmera</button>

  <script type="module">
    import { BarcodeDetector } from 'https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js';

    const scannerBox = document.getElementById('scanner-box');
    const video = document.getElementById('camera');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const zoomBadge = document.getElementById('zoom-badge');
    const actionBtn = document.getElementById('action-btn');
    const barcodeEl = document.getElementById('barcode');
    const statusEl = document.getElementById('status');
    const placeholderEl = document.getElementById('placeholder');

    const detector = new BarcodeDetector({
      formats: [
        'qr_code',
        'ean_13',
        'ean_8',
        'upc_a',
        'upc_e',
        'code_128',
        'code_39',
        'itf',
        'codabar'
      ]
    });

    let stream = null;
    let videoTrack = null;
    let isScanning = false;
    let scanTimer = null;

    // Variáveis de controle do Zoom (Pinça)
    let supportsHardwareZoom = false;
    let minZoom = 1;
    let maxZoom = 5;
    let currentZoom = 1;
    let initialPinchDistance = 0;
    let initialZoomAtPinch = 1;
    let isApplyingZoom = false;

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    async function setZoomLevel(newZoom) {
      currentZoom = Math.min(Math.max(newZoom, minZoom), maxZoom);
      zoomBadge.textContent = `${currentZoom.toFixed(1)}x`;

      if (supportsHardwareZoom && videoTrack) {
        if (isApplyingZoom) return;
        isApplyingZoom = true;
        try {
          await videoTrack.applyConstraints({
            advanced: [{ zoom: currentZoom }]
          });
        } catch (e) {
          console.warn('Falha ao aplicar zoom de hardware:', e);
        } finally {
          isApplyingZoom = false;
        }
      } else {
        // Fallback: Zoom visual via CSS caso a câmera não exponha zoom físico
        video.style.transform = `scale(${currentZoom})`;
        canvas.style.transform = `scale(${currentZoom})`;
      }
    }

    // Eventos de toque para movimento de pinça (2 dedos)
    scannerBox.addEventListener('touchstart', (e) => {
      if (!isScanning || e.touches.length !== 2) return;
      e.preventDefault();
      initialPinchDistance = getTouchDistance(e.touches);
      initialZoomAtPinch = currentZoom;
    }, { passive: false });

    scannerBox.addEventListener('touchmove', (e) => {
      if (!isScanning || e.touches.length !== 2 || initialPinchDistance === 0) return;
      e.preventDefault();
      const currentDistance = getTouchDistance(e.touches);
      const scaleFactor = currentDistance / initialPinchDistance;
      setZoomLevel(initialZoomAtPinch * scaleFactor);
    }, { passive: false });

    scannerBox.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = 0;
      }
    });

    function clearOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawBoundingBox(cornerPoints) {
      if (!cornerPoints || cornerPoints.length < 4) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(cornerPoints[0].x, cornerPoints[0].y);
      for (let i = 1; i < cornerPoints.length; i++) {
        ctx.lineTo(cornerPoints[i].x, cornerPoints[i].y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function stopScanner(successMessage = null) {
      isScanning = false;

      if (scanTimer) {
        clearTimeout(scanTimer);
        scanTimer = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      videoTrack = null;
      video.srcObject = null;
      video.style.transform = 'scale(1)';
      canvas.style.transform = 'scale(1)';
      zoomBadge.style.display = 'none';
      clearOverlay();
      placeholderEl.style.display = 'block';

      statusEl.textContent = successMessage || 'Câmera parada';
      actionBtn.textContent = 'Iniciar Câmera';
      actionBtn.classList.remove('stop-mode');
      actionBtn.disabled = false;
    }

    async function scanLoop() {
      if (!isScanning || video.readyState < 2) {
        if (isScanning) scanTimer = setTimeout(scanLoop, 80);
        return;
      }

      try {
        const barcodes = await detector.detect(video);

        if (barcodes.length > 0 && isScanning) {
          const found = barcodes[0];

          drawBoundingBox(found.cornerPoints);
          barcodeEl.textContent = found.rawValue;

          if (navigator.vibrate) {
            navigator.vibrate(100);
          }

          isScanning = false;
          setTimeout(() => {
            stopScanner(`Código lido (${found.format.toUpperCase()})!`);
          }, 250);
          return;
        }
      } catch (err) {
        console.error('Erro no frame:', err);
      }

      if (isScanning) {
        scanTimer = setTimeout(scanLoop, 80);
      }
    }

    async function getBestCameraStream() {
      const highResConstraints = {
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      try {
        return await navigator.mediaDevices.getUserMedia(highResConstraints);
      } catch {
        return await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }
    }

    async function toggleScanner() {
      actionBtn.disabled = true;

      if (isScanning) {
        stopScanner();
        return;
      }

      barcodeEl.textContent = 'Aguardando...';
      statusEl.textContent = 'Abrindo câmera em alta definição...';
      placeholderEl.style.display = 'none';

      try {
        stream = await getBestCameraStream();
        video.srcObject = stream;
        await video.play();

        videoTrack = stream.getVideoTracks()[0];
        supportsHardwareZoom = false;
        minZoom = 1;
        maxZoom = 4;
        currentZoom = 1;

        if (videoTrack && videoTrack.getCapabilities) {
          const caps = videoTrack.getCapabilities();
          const advanced = [];

          if (caps.focusMode && caps.focusMode.includes('continuous')) {
            advanced.push({ focusMode: 'continuous' });
          }

          // Verifica suporte nativo da lente ao zoom
          if (caps.zoom) {
            supportsHardwareZoom = true;
            minZoom = caps.zoom.min || 1;
            maxZoom = Math.min(caps.zoom.max || 5, 8); // Limita a 8x para não perder foco
            currentZoom = minZoom;
          }

          if (advanced.length > 0) {
            videoTrack.applyConstraints({ advanced }).catch(() => {});
          }
        }

        zoomBadge.textContent = `${currentZoom.toFixed(1)}x`;
        zoomBadge.style.display = 'block';

        isScanning = true;
        statusEl.textContent = 'Aponte para o código (faça pinça na tela para zoom)...';
        actionBtn.textContent = 'Parar Câmera';
        actionBtn.classList.add('stop-mode');
        actionBtn.disabled = false;

        scanLoop();

      } catch (err) {
        console.error('Erro ao iniciar câmera:', err);
        stopScanner('Erro: Permissão negada ou câmera indisponível.');
        barcodeEl.textContent = '---';
        actionBtn.textContent = 'Tentar Novamente';
      }
    }

    actionBtn.addEventListener('click', toggleScanner);
    window.addEventListener('pagehide', () => stopScanner());
  </script>

</body>
</html>
