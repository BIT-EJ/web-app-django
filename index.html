<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Leitor de Código</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Câmera ocupando 100% da tela */
    .camera-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }

    video, canvas#overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }

    canvas#overlay {
      pointer-events: none;
      z-index: 2;
    }

    /* Indicador de Zoom em porcentagem (0% a 100%) */
    #zoom-badge {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: 18px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    /* Barra branca na parte inferior */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      color: #111111;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.28);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .result-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    #status {
      font-size: 12px;
      color: #666666;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #barcode {
      font-size: 19px;
      font-weight: 700;
      color: #111111;
      overflow-wrap: anywhere;
      line-height: 1.2;
    }

    #barcode.detected {
      color: #008a4b;
    }

    #start-btn {
      flex-shrink: 0;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #111111;
      color: #ffffff;
      transition: opacity 0.2s, transform 0.1s;
    }

    #start-btn:active {
      transform: scale(0.96);
    }

    #start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="camera-fullscreen" id="scanner-box">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <span id="zoom-badge">0%</span>
  </div>

  <div class="bottom-bar">
    <div class="result-info">
      <div id="status">Câmera desligada</div>
      <div id="barcode">Aguardando leitura...</div>
    </div>
    <button id="start-btn">Iniciar</button>
  </div>

  <script type="module">
    import { BarcodeDetector } from 'https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js';

    const scannerBox = document.getElementById('scanner-box');
    const video = document.getElementById('camera');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const zoomBadge = document.getElementById('zoom-badge');
    const startBtn = document.getElementById('start-btn');
    const barcodeEl = document.getElementById('barcode');
    const statusEl = document.getElementById('status');

    // Canvas auxiliar para leitura em longa distância (multi-escala)
    const cropCanvas = document.createElement('canvas');
    const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

    const detector = new BarcodeDetector({
      formats: [
        'qr_code',
        'ean_13',
        'ean_8',
        'upc_a',
        'upc_e',
        'code_128',
        'code_39',
        'itf',
        'codabar'
      ]
    });

    let stream = null;
    let videoTrack = null;
    let isScanning = false;
    let scanTimer = null;
    let frameStep = 0;

    // Controle de Zoom Máximo Híbrido (0% a 100%)
    let supportsHardwareZoom = false;
    let hwMinZoom = 1;
    let hwMaxZoom = 1;
    let totalMaxZoom = 10; // Zoom máximo combinado (Hardware + Extra digital)
    let currentZoom = 1;
    let initialPinchDistance = 0;
    let initialZoomAtPinch = 1;
    let isApplyingZoom = false;

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    function updateZoomPercentageBadge() {
      if (totalMaxZoom <= hwMinZoom) {
        zoomBadge.textContent = '0%';
        return;
      }
      const percent = Math.round(((currentZoom - hwMinZoom) / (totalMaxZoom - hwMinZoom)) * 100);
      zoomBadge.textContent = `${Math.min(Math.max(percent, 0), 100)}%`;
    }

    async function setZoomLevel(newZoom) {
      currentZoom = Math.min(Math.max(newZoom, hwMinZoom), totalMaxZoom);
      updateZoomPercentageBadge();

      if (supportsHardwareZoom && videoTrack) {
        // Aplica até o limite máximo absoluto da lente física
        const targetHwZoom = Math.min(currentZoom, hwMaxZoom);
        // Se o usuário puxou além do limite físico, complementa com ampliação digital suave
        const extraDigitalScale = currentZoom > hwMaxZoom ? (currentZoom / hwMaxZoom) : 1;

        video.style.transform = `scale(${extraDigitalScale})`;
        canvas.style.transform = `scale(${extraDigitalScale})`;

        if (isApplyingZoom) return;
        isApplyingZoom = true;
        try {
          await videoTrack.applyConstraints({
            advanced: [{ zoom: targetHwZoom }]
          });
        } catch (e) {
          console.warn('Falha ao aplicar zoom físico:', e);
        } finally {
          isApplyingZoom = false;
        }
      } else {
        video.style.transform = `scale(${currentZoom})`;
        canvas.style.transform = `scale(${currentZoom})`;
      }
    }

    scannerBox.addEventListener('touchstart', (e) => {
      if (!isScanning || e.touches.length !== 2) return;
      e.preventDefault();
      initialPinchDistance = getTouchDistance(e.touches);
      initialZoomAtPinch = currentZoom;
    }, { passive: false });

    scannerBox.addEventListener('touchmove', (e) => {
      if (!isScanning || e.touches.length !== 2 || initialPinchDistance === 0) return;
      e.preventDefault();
      const currentDistance = getTouchDistance(e.touches);
      const scaleFactor = currentDistance / initialPinchDistance;
      setZoomLevel(initialZoomAtPinch * scaleFactor);
    }, { passive: false });

    scannerBox.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = 0;
      }
    });

    function clearOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawBoundingBox(cornerPoints, offsetX = 0, offsetY = 0) {
      if (!cornerPoints || cornerPoints.length < 4) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = Math.max(4, Math.round(canvas.width / 200));
      ctx.beginPath();
      ctx.moveTo(cornerPoints[0].x + offsetX, cornerPoints[0].y + offsetY);
      for (let i = 1; i < cornerPoints.length; i++) {
        ctx.lineTo(cornerPoints[i].x + offsetX, cornerPoints[i].y + offsetY);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function stopScanner(successMessage = null) {
      isScanning = false;

      if (scanTimer) {
        clearTimeout(scanTimer);
        scanTimer = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      videoTrack = null;
      video.srcObject = null;
      video.style.transform = 'scale(1)';
      canvas.style.transform = 'scale(1)';
      zoomBadge.style.display = 'none';
      clearOverlay();

      statusEl.textContent = successMessage || 'Câmera desligada';
      startBtn.style.display = 'inline-block';
      startBtn.disabled = false;
    }

    async function detectMultiScale() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      frameStep = (frameStep + 1) % 3;

      if (frameStep === 0) {
        const codes = await detector.detect(video);
        if (codes.length > 0) {
          return { code: codes[0], offsetX: 0, offsetY: 0 };
        }
      }

      if (frameStep === 1) {
        const cw = Math.floor(vw * 0.5);
        const ch = Math.floor(vh * 0.5);
        const sx = Math.floor((vw - cw) / 2);
        const sy = Math.floor((vh - ch) / 2);

        cropCanvas.width = cw;
        cropCanvas.height = ch;
        cropCtx.drawImage(video, sx, sy, cw, ch, 0, 0, cw, ch);

        const codes = await detector.detect(cropCanvas);
        if (codes.length > 0) {
          return { code: codes[0], offsetX: sx, offsetY: sy };
        }
      }

      if (frameStep === 2) {
        const cw = Math.floor(vw * 0.25);
        const ch = Math.floor(vh * 0.25);
        const sx = Math.floor((vw - cw) / 2);
        const sy = Math.floor((vh - ch) / 2);

        cropCanvas.width = cw;
        cropCanvas.height = ch;
        cropCtx.drawImage(video, sx, sy, cw, ch, 0, 0, cw, ch);

        const codes = await detector.detect(cropCanvas);
        if (codes.length > 0) {
          return { code: codes[0], offsetX: sx, offsetY: sy };
        }
      }

      return null;
    }

    async function scanLoop() {
      if (!isScanning || video.readyState < 2) {
        if (isScanning) scanTimer = setTimeout(scanLoop, 60);
        return;
      }

      try {
        const result = await detectMultiScale();

        if (result && isScanning) {
          const { code, offsetX, offsetY } = result;

          drawBoundingBox(code.cornerPoints, offsetX, offsetY);
          barcodeEl.textContent = code.rawValue;
          barcodeEl.classList.add('detected');

          if (navigator.vibrate) {
            navigator.vibrate(100);
          }

          isScanning = false;
          setTimeout(() => {
            stopScanner(`Código lido (${code.format.toUpperCase()})`);
          }, 250);
          return;
        }
      } catch (err) {
        console.error('Erro no frame:', err);
      }

      if (isScanning) {
        scanTimer = setTimeout(scanLoop, 60);
      }
    }

    async function getMaxQualityCameraStream() {
      const constraintsList = [
        {
          audio: false,
          video: {
            facingMode: 'environment',
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 30 }
          }
        },
        {
          audio: false,
          video: {
            facingMode: 'environment',
            width: { ideal: 2560 },
            height: { ideal: 1440 },
            frameRate: { ideal: 30 }
          }
        },
        {
          audio: false,
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 }
          }
        },
        {
          audio: false,
          video: { facingMode: 'environment' }
        },
        {
          audio: false,
          video: true
        }
      ];

      for (const constraints of constraintsList) {
        try {
          return await navigator.mediaDevices.getUserMedia(constraints);
        } catch {
          // Tenta o próximo nível de resolução
        }
      }

      throw new Error('Não foi possível acessar a câmera.');
    }

    async function startScanner() {
      if (isScanning) return;
      startBtn.disabled = true;

      barcodeEl.textContent = 'Procurando código...';
      barcodeEl.classList.remove('detected');
      statusEl.textContent = 'Iniciando câmera em qualidade máxima...';

      try {
        stream = await getMaxQualityCameraStream();
        video.srcObject = stream;
        await video.play();

        videoTrack = stream.getVideoTracks()[0];
        supportsHardwareZoom = false;
        hwMinZoom = 1;
        hwMaxZoom = 1;
        totalMaxZoom = 10;
        currentZoom = 1;

        if (videoTrack && videoTrack.getCapabilities) {
          const caps = videoTrack.getCapabilities();
          const advanced = [];

          const maxConstraints = {};
          if (caps.width && caps.width.max) {
            maxConstraints.width = { ideal: caps.width.max };
          }
          if (caps.height && caps.height.max) {
            maxConstraints.height = { ideal: caps.height.max };
          }
          if (Object.keys(maxConstraints).length > 0) {
            await videoTrack.applyConstraints(maxConstraints).catch(() => {});
          }

          if (caps.focusMode && caps.focusMode.includes('continuous')) {
            advanced.push({ focusMode: 'continuous' });
          }

          if (caps.zoom) {
            supportsHardwareZoom = true;
            hwMinZoom = caps.zoom.min || 1;
            // Libera 100% do zoom máximo da lente do aparelho
            hwMaxZoom = caps.zoom.max || 10;
            // Adiciona mais 2x de ampliação digital após atingir o topo físico da câmera
            totalMaxZoom = hwMaxZoom * 2;
            currentZoom = hwMinZoom;
            advanced.push({ zoom: hwMinZoom });
          }

          if (advanced.length > 0) {
            await videoTrack.applyConstraints({ advanced }).catch(() => {});
          }
        }

        updateZoomPercentageBadge();
        zoomBadge.style.display = 'block';

        startBtn.style.display = 'none';

        isScanning = true;
        statusEl.textContent = 'Aponte para o código (pinça na tela para aproximar)';
        scanLoop();

      } catch (err) {
        console.error('Erro ao iniciar câmera:', err);
        stopScanner('Erro ao acessar a câmera');
        barcodeEl.textContent = 'Permissão negada ou indisponível';
      }
    }

    startBtn.addEventListener('click', startScanner);
    window.addEventListener('pagehide', () => stopScanner());
  </script>

</body>
</html>
