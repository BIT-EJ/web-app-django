<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Código de Barras</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .scanner-box {
      width: 100%;
      max-width: 500px;
      min-height: 280px;
      background: #000;
      border: 2px solid #333;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      object-fit: cover;
      border-radius: 14px;
    }

    .placeholder-text {
      color: #666;
      font-size: 14px;
      position: absolute;
      pointer-events: none;
    }

    .result {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      background: #202228;
      border-radius: 12px;
      border: 1px solid #383b44;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-label {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #barcode {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: bold;
      color: #00ff88;
      overflow-wrap: anywhere;
    }

    #status {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }

    #action-btn {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #00cc77;
      color: #07140e;
      transition: background 0.2s, transform 0.1s;
    }

    #action-btn:active {
      transform: scale(0.98);
    }

    #action-btn.stop-mode {
      background: #ff4757;
      color: white;
    }

    #action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <h1>Leitor de Código de Barras</h1>

  <div class="scanner-box">
    <span class="placeholder-text" id="placeholder">Câmera desligada</span>
    <div id="reader"></div>
  </div>

  <div class="result">
    <span class="result-label">Código identificado</span>
    <span id="barcode">---</span>
  </div>

  <p id="status">Clique no botão abaixo para ler</p>

  <button id="action-btn">Iniciar Câmera</button>

  <script>
    const actionBtn = document.getElementById('action-btn');
    const barcodeEl = document.getElementById('barcode');
    const statusEl = document.getElementById('status');
    const placeholderEl = document.getElementById('placeholder');

    const html5QrCode = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },
      verbose: false
    });

    let isScanning = false;

    async function stopScanner(successMessage = null) {
      if (!isScanning) return;

      try {
        await html5QrCode.stop();
        html5QrCode.clear();
      } catch (err) {
        console.error('Erro ao parar:', err);
      } finally {
        isScanning = false;
        placeholderEl.style.display = 'block';
        statusEl.textContent = successMessage || 'Câmera parada';
        actionBtn.textContent = 'Iniciar Câmera';
        actionBtn.classList.remove('stop-mode');
        actionBtn.disabled = false;
      }
    }

    async function toggleScanner() {
      actionBtn.disabled = true;

      if (isScanning) {
        await stopScanner();
        return;
      }

      barcodeEl.textContent = 'Aguardando...';
      statusEl.textContent = 'Abrindo câmera...';
      placeholderEl.style.display = 'none';

      // Calcula a área de leitura proporcional ao tamanho real do vídeo
      const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
        const width = Math.floor(viewfinderWidth * 0.85);
        const height = Math.floor(viewfinderHeight * 0.45);
        return {
          width: Math.max(220, width),
          height: Math.max(110, height)
        };
      };

      const config = {
        fps: 20,
        qrbox: qrboxFunction,
        videoConstraints: {
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 },
          focusMode: "continuous"
        }
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText, decodedResult) => {
            barcodeEl.textContent = decodedText;

            if (navigator.vibrate) {
              navigator.vibrate(100);
            }

            const formatName = decodedResult?.result?.format?.formatName || '';
            const msg = formatName
              ? `Código lido (${formatName})!`
              : 'Código lido com sucesso!';

            stopScanner(msg);
          },
          () => {
            // Ignora frames sem código detectado
          }
        );

        isScanning = true;
        statusEl.textContent = 'Centralize o código de barras na área marcada...';
        actionBtn.textContent = 'Parar Câmera';
        actionBtn.classList.add('stop-mode');
        actionBtn.disabled = false;

      } catch (err) {
        console.error('Erro ao iniciar câmera:', err);
        placeholderEl.style.display = 'block';
        barcodeEl.textContent = '---';
        statusEl.textContent = 'Erro ao acessar a câmera. Verifique as permissões.';
        actionBtn.textContent = 'Tentar Novamente';
        actionBtn.classList.remove('stop-mode');
        actionBtn.disabled = false;
      }
    }

    actionBtn.addEventListener('click', toggleScanner);

    window.addEventListener('pagehide', () => {
      if (isScanning) {
        html5QrCode.stop().catch(() => {});
      }
    });
  </script>

</body>
</html>
