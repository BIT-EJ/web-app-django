<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Código de Barras</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .scanner-box {
      width: 100%;
      max-width: 500px;
      min-height: 260px;
      background: #000;
      border: 2px solid #333;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #reader {
      width: 100%;
    }

    /* Esconde elementos extras que a lib cria por padrão */
    #reader__dashboard_section_csr span,
    #reader__status_span {
      display: none !important;
    }

    .placeholder-text {
      color: #666;
      font-size: 14px;
      position: absolute;
      pointer-events: none;
    }

    .result {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      background: #202228;
      border-radius: 12px;
      border: 1px solid #383b44;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-label {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #barcode {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: bold;
      color: #00ff88;
      overflow-wrap: anywhere;
    }

    #status {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }

    #action-btn {
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #00cc77;
      color: #07140e;
      transition: background 0.2s, transform 0.1s;
    }

    #action-btn:active {
      transform: scale(0.98);
    }

    #action-btn.stop-mode {
      background: #ff4757;
      color: white;
    }

    #action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <h1>Leitor de Código de Barras</h1>

  <div class="scanner-box">
    <span class="placeholder-text" id="placeholder">Câmera desligada</span>
    <div id="reader"></div>
  </div>

  <div class="result">
    <span class="result-label">Código identificado</span>
    <span id="barcode">---</span>
  </div>

  <p id="status">Clique no botão abaixo para ler</p>

  <button id="action-btn">Iniciar Câmera</button>

  <script>
    const actionBtn = document.getElementById('action-btn');
    const barcodeEl = document.getElementById('barcode');
    const statusEl = document.getElementById('status');
    const placeholderEl = document.getElementById('placeholder');

    // Inicializa a instância da biblioteca Html5Qrcode
    const html5QrCode = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.CODABAR
      ],
      verbose: false
    });

    let isScanning = false;

    async function toggleScanner() {
      actionBtn.disabled = true;

      // SE ESTIVER LENDO -> PARA A CÂMERA
      if (isScanning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
          isScanning = false;
          placeholderEl.style.display = 'block';
          statusEl.textContent = 'Câmera parada';
          actionBtn.textContent = 'Iniciar Câmera';
          actionBtn.classList.remove('stop-mode');
        } catch (err) {
          console.error('Erro ao parar:', err);
        } finally {
          actionBtn.disabled = false;
        }
        return;
      }

      // SE ESTIVER PARADO -> LIMPA O ANTERIOR E INICIA A CÂMERA
      barcodeEl.textContent = 'Aguardando...';
      statusEl.textContent = 'Abrindo câmera...';
      placeholderEl.style.display = 'none';

      const config = {
        fps: 15,
        qrbox: { width: 280, height: 140 }, // Área focada para códigos de barras horizontais
        aspectRatio: 1.5
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" }, // Prioriza câmera traseira, com fallback automático para webcam
          config,
          (decodedText) => {
            // Sucesso na leitura
            barcodeEl.textContent = decodedText;
            statusEl.textContent = 'Código lido com sucesso!';

            if (navigator.vibrate) {
              navigator.vibrate(100);
            }

            // Para a câmera automaticamente após ler o código
            toggleScanner();
          },
          () => {
            // Ignora erros de frame vazio enquanto procura o código
          }
        );

        isScanning = true;
        statusEl.textContent = 'Aponte para o código de barras...';
        actionBtn.textContent = 'Parar Câmera';
        actionBtn.classList.add('stop-mode');

      } catch (err) {
        console.error('Erro ao iniciar câmera:', err);
        placeholderEl.style.display = 'block';
        barcodeEl.textContent = '---';
        statusEl.textContent = 'Erro: Verifique a permissão da câmera ou use HTTPS.';
        actionBtn.textContent = 'Tentar Novamente';
        actionBtn.classList.remove('stop-mode');
      } finally {
        actionBtn.disabled = false;
      }
    }

    actionBtn.addEventListener('click', toggleScanner);

    // Garante que a câmera desligue se o usuário sair da aba
    window.addEventListener('pagehide', () => {
      if (isScanning) {
        html5QrCode.stop().catch(() => {});
      }
    });
  </script>

</body>
</html>
